<div class="cart-section">
    <h2 class="cart-section-title">Доставка</h2>

    <div class="delivery-options">
        <div class="delivery-option">
            <input type="radio" name="delivery_type" id="{{ id_prefix }}delivery_pickup" value="pickup" checked class="delivery-radio">
            <label for="{{ id_prefix }}delivery_pickup" class="delivery-label">
                <span class="delivery-name">Самовывоз</span>
                <span class="delivery-price-badge">0 ₴</span>
            </label>
        </div>
        <div class="delivery-option">
            <input type="radio" name="delivery_type" id="{{ id_prefix }}delivery_nova_posta" value="nova_posta" class="delivery-radio">
            <label for="{{ id_prefix }}delivery_nova_posta" class="delivery-label">
                <span class="delivery-name">Nova Posta</span>
            </label>
        </div>
    </div>

    <!-- Самовывоз -->
    <div class="delivery-form pickup-delivery-form" id="{{ id_prefix }}pickupDeliveryForm" hidden>
        {% if pickup_places %}
            <div class="form-group">
                <label class="form-label-sm">Место самовывоза</label>
                <div class="location-scroll-list">
                {% for place in pickup_places %}
                    <div class="pickup-place-option">
                        <input type="radio" name="pickup_place_id" id="{{ id_prefix }}pickup_{{ place.id }}"
                               value="{{ place.id }}"
                               class="pickup-place-radio" {% if forloop.first %}checked{% endif %}>
                        <label for="{{ id_prefix }}pickup_{{ place.id }}">{{ place.address }}</label>
                    </div>
                {% endfor %}
                </div>
            </div>
        {% else %}
            <p class="delivery-note">Адрес самовывоза уточняйте у менеджера</p>
        {% endif %}
        <div class="form-group">
            <label for="{{ id_prefix }}pickupComment">Комментарий</label>
            <textarea id="{{ id_prefix }}pickupComment" name="comment" rows="2" maxlength="500" class="form-control comment-textarea"></textarea>
            <span class="char-counter">0 / 500</span>
        </div>
    </div>

    <!-- Nova Posta -->
    <div class="delivery-form nova-posta-delivery-form" id="{{ nova_posta_form_id }}" hidden>
        <p class="delivery-note delivery-note-info">Оплачивается отдельно по тарифам перевозчика</p>

        <div class="delivery-options">
            <div class="delivery-option">
                <input type="radio" name="nova_posta_type" id="{{ id_prefix }}np_post_office" value="post_office" checked class="delivery-radio">
                <label for="{{ id_prefix }}np_post_office" class="delivery-label">
                    <span class="delivery-name">Отделение</span>
                </label>
            </div>
            <div class="delivery-option">
                <input type="radio" name="nova_posta_type" id="{{ id_prefix }}np_parcel_locker" value="parcel_locker" class="delivery-radio">
                <label for="{{ id_prefix }}np_parcel_locker" class="delivery-label">
                    <span class="delivery-name">Поштомат</span>
                </label>
            </div>
            <div class="delivery-option">
                <input type="radio" name="nova_posta_type" id="{{ id_prefix }}np_address" value="address" class="delivery-radio">
                <label for="{{ id_prefix }}np_address" class="delivery-label">
                    <span class="delivery-name">Адрес</span>
                </label>
            </div>
        </div>

        <div class="nova-posta-sub-form" id="{{ id_prefix }}npPostOfficeForm">
            <div class="form-group">
                <label for="{{ id_prefix }}postOffice">Номер отделения</label>
                <input type="number" id="{{ id_prefix }}postOffice" name="post_office" min="1" class="form-control" autocomplete="off">
            </div>
        </div>

        <div class="nova-posta-sub-form" id="{{ id_prefix }}npParcelLockerForm" hidden>
            <div class="form-group">
                <label for="{{ id_prefix }}parcelLocker">Номер поштомата</label>
                <input type="number" id="{{ id_prefix }}parcelLocker" name="parcel_locker" min="1" class="form-control" autocomplete="off">
            </div>
        </div>

        <div class="nova-posta-sub-form" id="{{ id_prefix }}npAddressForm" hidden>
            <div class="form-group">
                <label for="{{ id_prefix }}novaPostaAddress">Адрес доставки</label>
                <input type="text" id="{{ id_prefix }}novaPostaAddress" name="nova_posta_address" class="form-control" autocomplete="off" placeholder="Город, улица, дом, квартира">
            </div>
        </div>

        <div class="form-group">
            <label for="{{ id_prefix }}deliveryComment">Комментарий</label>
            <textarea id="{{ id_prefix }}deliveryComment" name="comment" rows="2" maxlength="500" class="form-control comment-textarea"></textarea>
            <span class="char-counter">0 / 500</span>
        </div>
    </div>
</div>
